name: Build APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & sign APK with apktool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool

      - name: Build APK with apktool
        run: |
          apktool b android -o app-unsigned.apk
          ls -la app-unsigned.apk

      - name: Sign APK with Solina release key
        run: |
          echo "${{ secrets.CFBRIDGE_KEYSTORE_BASE64 }}" | base64 -d > solina.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore solina.keystore -storepass "${{ secrets.CFBRIDGE_KEYSTORE_PASSWORD }}" -keypass "${{ secrets.CFBRIDGE_KEY_PASSWORD }}" app-unsigned.apk "${{ secrets.CFBRIDGE_KEY_ALIAS }}"

      - name: Align APK with zipalign
        run: |
          ZIPALIGN=$(find "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ]; then echo "zipalign not found"; exit 1; fi
          "$ZIPALIGN" -f -p 4 app-unsigned.apk SolinaCF-Bridge-v1.0.0.apk
          "$ZIPALIGN" -c -v 4 SolinaCF-Bridge-v1.0.0.apk
          ls -la SolinaCF-Bridge-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolinaCF-Bridge-v1.0.0
          path: SolinaCF-Bridge-v1.0.0.apk
          if-no-files-found: error

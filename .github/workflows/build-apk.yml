name: Build APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & sign APK with apktool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool

      - name: Set up NDK 28
        run: |
          if [ -d "$ANDROID_HOME/ndk/28.0.13004108" ]; then
            echo "NDK 28.0.13004108 already installed"
          else
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Build libpol_llm.so (llama.cpp, arm64-v8a)
        run: |
          # Pinned llama.cpp commit from upstream pol_llm.cpp (sparse: ~50 MB)
          git init /tmp/llama.cpp
          cd /tmp/llama.cpp
          git remote add origin https://github.com/ggerganov/llama.cpp
          git sparse-checkout init --cone
          git fetch --depth 1 --filter=blob:none origin 919794500475862f6768c353255469dc661cb734
          git sparse-checkout set src include ggml cmake vendor
          git checkout 919794500475862f6768c353255469dc661cb734
          cd "$GITHUB_WORKSPACE"
          cmake -S android/native -B /tmp/llm-build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_SRC=/tmp/llama.cpp \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DGGML_OPENMP=OFF
          cmake --build /tmp/llm-build --target pol_llm -j"$(nproc)"
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" /tmp/llm-build/libpol_llm.so
          mkdir -p android/lib/arm64-v8a
          cp /tmp/llm-build/libpol_llm.so android/lib/arm64-v8a/libpol_llm.so
          ls -la android/lib/arm64-v8a/

      - name: Build APK with apktool
        run: |
          apktool b android -o app-unsigned.apk
          ls -la app-unsigned.apk

      - name: Store native lib uncompressed
        run: |
          python3 - <<'PYEOF'
          import zipfile, shutil
          src = 'app-unsigned.apk'
          tmp = 'app-unsigned-stored.apk'
          zin = zipfile.ZipFile(src, 'r')
          zout = zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED)
          for item in zin.infolist():
              data = zin.read(item.filename)
              if item.filename == 'lib/arm64-v8a/libpol_llm.so':
                  zout.writestr(item, data, compress_type=zipfile.ZIP_STORED)
              else:
                  zout.writestr(item, data, compress_type=item.compress_type)
          zout.close(); zin.close()
          shutil.move(tmp, src)
          PYEOF
          unzip -l app-unsigned.apk | grep libpol_llm

      - name: Sign APK with Solina release key
        run: |
          echo "${{ secrets.CFBRIDGE_KEYSTORE_BASE64 }}" | base64 -d > solina.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore solina.keystore -storepass "${{ secrets.CFBRIDGE_KEYSTORE_PASSWORD }}" -keypass "${{ secrets.CFBRIDGE_KEY_PASSWORD }}" app-unsigned.apk "${{ secrets.CFBRIDGE_KEY_ALIAS }}"

      - name: Align APK with zipalign
        run: |
          ZIPALIGN=$(find "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ]; then echo "zipalign not found"; exit 1; fi
          "$ZIPALIGN" -f -p 4 app-unsigned.apk SolinaCF-Bridge-v1.0.0.apk
          "$ZIPALIGN" -c -v 4 SolinaCF-Bridge-v1.0.0.apk
          ls -la SolinaCF-Bridge-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolinaCF-Bridge-v1.0.0
          path: SolinaCF-Bridge-v1.0.0.apk
          if-no-files-found: error

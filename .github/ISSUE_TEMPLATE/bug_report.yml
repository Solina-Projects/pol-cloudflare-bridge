name: 🐛 Bug Report
description: Report a bug or issue with Pol Cloudflare Bridge
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: App / Worker Version
      placeholder: "e.g. v1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      placeholder: "e.g. Xiaomi Poco X3 - Android 12"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output (if applicable)
      render: shell
